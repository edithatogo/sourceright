name: Robustness

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_fuzz:
        description: "Run parser fuzz smoke suite"
        required: false
        type: boolean
        default: true
      run_stress:
        description: "Run stress benchmark suite"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "53 4 * * 3"

permissions:
  contents: read

concurrency:
  group: robustness-${{ github.ref }}
  cancel-in-progress: true

env:
  ARTIFACT_LABEL: robustness-${{ github.sha || github.run_id }}

jobs:
  benchmark-smoke:
    name: CLI benchmark smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run benchmark smoke (JSON)
        run: |
          mkdir -p bench-artifacts
          cargo run --locked --bin sourceright -- bench --json > bench-artifacts/benchmark-results.json
      - name: Upload benchmark artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ env.ARTIFACT_LABEL }}-benchmark-smoke
          path: bench-artifacts/benchmark-results.json

  fuzz:
    if: github.event_name == 'pull_request' || github.event_name == 'schedule' || inputs.run_fuzz
    name: parser fuzz smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Select changed parser inputs
        id: fuzz-scope
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python3 - <<'PYTHON'
          import os
          import subprocess

          run = True
          if os.environ["EVENT_NAME"] == "pull_request":
              paths = subprocess.check_output(
                  ["git", "diff", "--name-only", "-z", "HEAD^1", "HEAD"], text=True
              ).split("\0")
              run = any(
                  path.startswith(("src/", "fuzz/", "schemas/"))
                  or path in ("Cargo.toml", "Cargo.lock", ".github/workflows/robustness.yml")
                  for path in paths
              )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"run={str(run).lower()}\n")
          print("Parser campaign selected" if run else "Parser input paths unchanged")
          PYTHON
      - name: Install Rust nightly
        if: steps.fuzz-scope.outputs.run == 'true'
        uses: dtolnay/rust-toolchain@2c76c034f9e32a5d6e2c104dc4df23a22476db04 # nightly
        with:
          toolchain: nightly-2026-11-19
      - name: Install cargo-fuzz
        if: steps.fuzz-scope.outputs.run == 'true'
        run: cargo +nightly-2026-11-19 install cargo-fuzz --version 0.13.2 --locked
      - name: Run bounded parser campaigns
        if: steps.fuzz-scope.outputs.run == 'true'
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '30' || '300' }}
          CARGO_BUILD_JOBS: '2'
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/parser-fuzz"
          {
            git rev-parse HEAD
            rustc +nightly-2026-11-19 --version
            cargo +nightly-2026-11-19 fuzz --version
          } | tee "$RUNNER_TEMP/parser-fuzz/environment.txt"
          for target in validate_csl validate_sidecar; do
            cargo +nightly-2026-11-19 fuzz run "$target" --codegen-units 16 -- \
              -max_total_time="$FUZZ_SECONDS" -max_len=65536 -rss_limit_mb=1024 -timeout=5 \
              2>&1 | tee "$RUNNER_TEMP/parser-fuzz/$target.txt"
          done
      - name: Retain parser campaign evidence
        if: always() && steps.fuzz-scope.outputs.run == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: parser-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/parser-fuzz
            fuzz/artifacts
          if-no-files-found: ignore
          retention-days: 14

  stress-bench:
    if: github.event_name == 'schedule' || inputs.run_stress
    name: scheduled robustness gates
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Run stress benchmarks and write metrics
        run: |
          mkdir -p sourceright-bench/metrics
          metric_path="sourceright-bench/metrics/robustness-stress-$(date -u +%Y%m%d-%H%M%S).json"
          cargo run --locked --bin sourceright -- bench --manifest sourceright-bench/tasks-stress.yaml --json \
            > "$metric_path"
          python3 - <<'PY'
          import csv
          import json
          from pathlib import Path

          path = sorted(Path("sourceright-bench/metrics").glob("robustness-stress-*.json"))[-1]
          report = json.loads(path.read_text(encoding="utf-8"))

          csv_path = path.with_suffix(".csv")
          with csv_path.open("w", encoding="utf-8", newline="") as handle:
              writer = csv.writer(handle)
              writer.writerow(["id", "baseline", "passed", "duration_ms"])
              for task in report.get("task_results", []):
                  writer.writerow([
                      task.get("id", ""),
                      task.get("baseline", ""),
                      task.get("passed", ""),
                      task.get("duration_ms", ""),
                  ])
          PY
      - name: Upload stress metrics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: robustness-stress-metrics
          path: |
            sourceright-bench/metrics/robustness-stress-*.json
            sourceright-bench/metrics/robustness-stress-*.csv

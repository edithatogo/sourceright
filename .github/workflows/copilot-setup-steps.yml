name: Copilot Setup Steps

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - ".github/copilot-instructions.md"
      - ".github/workflows/copilot-setup-steps.yml"
      - "Cargo.toml"
      - "Cargo.lock"
      - "docs-site/package.json"
      - "docs-site/package-lock.json"

permissions:
  contents: read

concurrency:
  group: copilot-setup-${{ github.ref }}
  cancel-in-progress: true

jobs:
  copilot-setup-steps:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
          cache: npm
          cache-dependency-path: docs-site/package-lock.json

      - name: Preflight Rust dependencies
        run: cargo fetch --locked

      - name: Preflight docs dependencies
        working-directory: docs-site
        run: npm ci

name: Quality

on:
  pull_request:
    paths:
      - ".github/**"
      - ".markdownlint-cli2.jsonc"
      - ".vale.ini"
      - ".vale/**"
      - "docs/**"
      - "conductor/**"
      - "README.md"
      - "lychee.toml"
  push:
    branches: ["main"]
    paths:
      - ".github/**"
      - ".markdownlint-cli2.jsonc"
      - ".vale.ini"
      - ".vale/**"
      - "docs/**"
      - "conductor/**"
      - "README.md"
      - "lychee.toml"
  schedule:
    - cron: "11 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  prose:
    name: Prose and Markdown
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22.23.4"
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.3"
      - name: Install Vale
        run: go install github.com/errata-ai/vale/v3/cmd/vale@v3.12.0
      - name: Vale prose lint
        run: vale --minAlertLevel=error README.md docs/src docs/import-manifest.md conductor .github/copilot-instructions.md
      - name: Markdown structure lint
        run: npx --yes markdownlint-cli2@0.18.1 README.md "docs/**/*.md" "conductor/**/*.md" ".github/**/*.md"

  links:
    name: Offline link check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Install lychee
        run: cargo install lychee --locked
      - name: Check local links and anchors
        run: lychee --config lychee.toml --offline README.md docs/src/**/*.md docs/import-manifest.md conductor/**/*.md

  workflows:
    timeout-minutes: 10
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.27.3"
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.15.2"
      - name: Install actionlint
        run: go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Lint workflows
        run: actionlint
      - name: Enforce workflow harness invariants
        shell: pwsh
        run: ./scripts/check-workflow-harness.ps1
      - name: Install zizmor
        run: python -m pip install zizmor==1.14.2
      - name: Security-lint workflows
        run: zizmor --min-severity medium .github/workflows

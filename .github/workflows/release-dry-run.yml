name: Release dry run

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/release*.yml"
      - ".github/workflows/publish-crate.yml"
      - ".github/workflows/publish-mcp-registry.yml"
      - "deny.toml"
      - "typos.toml"
      - "conductor/evidence-ledger.json"
      - "conductor/implementation-order.md"
      - "conductor/release-channels.md"
      - "conductor/requirements.md"
      - "conductor/tracks.md"
      - "conductor/tracks/69-marketplace-submission-evidence/**"
      - "conductor/tracks/70-release-surface-refresh-cadence/**"
      - "docs/src/**"
      - "docs-site/src/content/docs/**"
      - "scripts/release-check.ps1"
      - "scripts/release-status.ps1"
      - "scripts/verify-release-surface-refresh.ps1"
      - "tests/public_surface_refresh_policy.rs"
      - "tests/quality_policy.rs"
      - "server.json"
      - "Dockerfile"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Build release
        run: cargo build --release --locked
      - name: Determine crates.io publication boundary
        id: crate-publication
        shell: bash
        run: |
          if grep -q 'citeweft' Cargo.toml && grep -q 'git' Cargo.toml; then
            echo "publishable=false" >> "$GITHUB_OUTPUT"
            echo "Crates.io dry-run deferred: CiteWeft is currently consumed from its stable Git tag and is not published on crates.io."
          else
            echo "publishable=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Package crate
        if: steps.crate-publication.outputs.publishable == 'true'
        run: cargo package --locked
      - name: Inventory exact locked Rust dependencies
        uses: edithatogo/repository-standards/.github/actions/cargo-lock-sbom@bc76f1fbe0fa87a1371eadc06b08f54b48c623f7
        with:
          lockfile: Cargo.lock
          output: target/sourceright.dependencies.cdx.json
          name: sourceright
          source-sha: ${{ github.sha }}
      - name: Scan release preparation dependencies
        uses: edithatogo/repository-standards/.github/actions/grype-scan@bc76f1fbe0fa87a1371eadc06b08f54b48c623f7
        with:
          sbom: target/sourceright.dependencies.cdx.json
          mode: enforce
          severity-cutoff: critical
          artifact-name: grype-sourceright-dry-run
          output-directory: .grype/dry-run-report
          source-sha: ${{ github.sha }}
      - name: Install checksum-verified cargo-deny 0.22.0
        shell: bash
        run: bash scripts/install-cargo-deny.sh
      - name: Dependency policy
        shell: bash
        run: |
          set -euo pipefail
          cargo deny check advisories bans sources
          duplicate_output="$(cargo tree -d --locked --target x86_64-unknown-linux-gnu 2>&1 || true)"
          unexpected_duplicates="$(
            printf '%s\n' "$duplicate_output" |
              grep -Ev '(^|[[:space:]])wit-bindgen([[:space:]]|$)' |
              grep -E '[[:alnum:]_.-]+[[:space:]]v[0-9]' || true
          )"
          if [ -n "$unexpected_duplicates" ]; then
            printf '%s\n' "$unexpected_duplicates"
            exit 1
          fi
      - name: Verify dependency SBOM
        shell: bash
        run: test -s target/sourceright.dependencies.cdx.json
      - name: Verify package checksum manifest
        if: steps.crate-publication.outputs.publishable == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cd target/package
          sha256sum -- ./*.crate > crate-sha256sums.txt
          sha256sum --check crate-sha256sums.txt
      - name: Generate dry-run package attestation
        if: steps.crate-publication.outputs.publishable == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: target/package/*.crate
      - name: Release surface evidence refresh
        shell: pwsh
        run: ./scripts/verify-release-surface-refresh.ps1
      - name: Publish dry run
        if: steps.crate-publication.outputs.publishable == 'true'
        run: cargo publish --dry-run --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked
      - name: Advisory public API compatibility
        continue-on-error: true
        run: cargo semver-checks check-release --release-type minor
      - name: CLI release smoke
        shell: bash
        run: |
          cargo run --release --locked --bin sourceright -- --version
          cargo run --release --locked --bin sourceright -- bench
